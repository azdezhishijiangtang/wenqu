name = "zhihu-study-vision"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# 免费计划的 Workers AI：每天 10000 Neurons，额度用完只会报错，不会产生费用。
[ai]
binding = "AI"

# 先执行：npx wrangler d1 create zhihu-study
# 再把返回的 database_id 填到下面。
[[d1_databases]]
binding = "DB"
database_name = "zhihu-study"
database_id = "ddafc07b-8207-4838-976f-dec92e903762"

[vars]
# 每个账号每天可识别的图片张数
DAILY_USER_LIMIT = "3"
# 全站每天可识别的图片总张数，用来兜住免费额度
DAILY_GLOBAL_LIMIT = "60"
ALLOWED_ORIGINS = "https://azdezhishijiangtang.github.io"
